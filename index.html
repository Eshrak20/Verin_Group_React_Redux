<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verin Group</title>

    <!-- 🎯 সঠিক ব্যাকএন্ড এপিআই ডোমেইনের জন্য preconnect -->
    <link rel="preconnect" href="https://v.veringroup.com" crossorigin />
    <link rel="dns-prefetch" href="https://v.veringroup.com" />
    
    <!-- 🎯 ইমেজ বা অন্যান্য এক্সটার্নাল সিডিএন থাকলে তার লিংক -->
    <link rel="preconnect" href="https://placehold.co" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
